<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>QA - Iframe srcdoc</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 32px;
      }

      iframe {
        width: 520px;
        height: 220px;
        border: 2px solid #805ad5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Padre con iframe srcdoc</h1>
      <iframe
        id="srcdoc-preview"
        title="Preview srcdoc"
      ></iframe>
    </main>

    <script>
      document.getElementById('srcdoc-preview').setAttribute(
        'srcdoc',
        `<!doctype html>
          <html lang="es">
            <head>
              <meta charset="utf-8" />
              <title>Documento srcdoc</title>
              <style>
                body { margin: 0; padding: 24px; font-family: system-ui, sans-serif; color: #4c1d95; background: #faf5ff; }
                main { min-height: 150px; padding: 20px; border-radius: 18px; background: white; }
              </style>
            </head>
            <body>
              <main data-qa-content="srcdoc-inline">
                <h1>Contenido srcdoc capturable</h1>
                <p>Debe reconstruirse como snapshot top-level sin ejecutar de nuevo sus scripts.</p>
                <input aria-label="Estado srcdoc" value="Estado inicial" />
              </main>
              <script>window.__srcdocApplicationExecuted = true;<\/script>
            </body>
          </html>`
      );
    </script>
  </body>
</html>
